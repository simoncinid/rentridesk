table: { schema: public, name: notifications }
object_relationships: [{ name: organization, using: { foreign_key_constraint_on: organization_id } }]
select_permissions:
  - role: user
    permission: { columns: "*", filter: { _and: [{ organization: { memberships: { user_id: { _eq: X-Hasura-User-Id }, status: { _eq: active } } } }, { _or: [{ user_id: { _is_null: true } }, { user_id: { _eq: X-Hasura-User-Id } }] }] } }
