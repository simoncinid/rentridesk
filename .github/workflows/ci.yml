name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm verify:unit
      - run: pnpm build
      - name: Check accidental secrets
        run: "! git grep -En '(BEGIN (RSA |EC )?PRIVATE KEY|NHOST_ADMIN_SECRET=.{8,}|STRIPE_SECRET_KEY=sk_)' -- ':!*.example'"
      - run: pnpm audit --audit-level high
